[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-trade-research"
version = "0.1.0"
description = "Reproducible ingestion for Vietnam Customs publications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pandas <= 3.0.6",
    "duckdb >= 1.5.6",
    "perspective-python >= 5.5.1",
    "pyarrow <= 26.0.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "plotly>=7.1.0",
    "pandoc>=2.4",
]

[project.scripts]
vietnam-customs = "ingestion.vietnam_customs.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
